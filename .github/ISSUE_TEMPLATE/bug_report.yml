name: Bug report
description: Something in SimuTrace is broken or behaving incorrectly
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What's broken?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Contract address, function, network, and args used (if applicable)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, or CLI + Node version
